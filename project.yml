# XcodeGen spec — a recovery / regeneration path for the Xcode project.
#
# The repo already ships a ready-to-open `LiarsDice.xcodeproj`. You only need
# this if that project ever gets out of sync or you'd rather generate it from
# a clean text spec:
#
#     brew install xcodegen
#     xcodegen generate
#
# It produces a project equivalent to the committed one.
name: LiarsDice
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  LiarsDice:
    type: application
    platform: iOS
    sources:
      - path: LiarsDice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.liarsdice
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
