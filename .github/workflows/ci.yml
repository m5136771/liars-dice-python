name: CI

# Builds and tests the iOS game on macOS runners. The pure game engine is
# tested with `swift test`; the SwiftUI app is compiled with xcodebuild for the
# iOS Simulator (no signing needed). This is what actually verifies the Swift
# code, since it can't be compiled in the Linux dev environment.

on:
  pull_request:
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-tests:
    name: Engine unit tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Run engine tests
        run: swift test

  app-build:
    name: Build iOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version
      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project LiarsDice.xcodeproj \
            -scheme LiarsDice \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
