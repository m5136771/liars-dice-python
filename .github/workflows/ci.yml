name: CI

# Verifies the pure game engine on every push / PR.
#
# The engine (LiarsDice/Engine) is Foundation-only Swift with no UI, so it
# builds and runs its XCTest suite on a Linux Swift toolchain — fast, free, and
# reliably provisioned. This is what compile-checks the core game logic.
#
# The SwiftUI iOS app itself targets iOS and is built/run in Xcode on a Mac
# (see README and docs/ROADMAP.md). GitHub-hosted macOS runners were not
# available for this repo, so the app build is not run in CI; build it locally
# with `open LiarsDice.xcodeproj` or `make build`.

on:
  pull_request:
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-tests:
    name: Engine unit tests (Linux)
    runs-on: ubuntu-latest
    container: swift:5.10
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Run engine tests
        run: swift test
